{% extends "dashboard/base.html" %}

{% block nav_setup %}active{% endblock %}

{% block extra_styles %}
<style>
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .page-header {
            margin-bottom: 24px;
        }
        
        .page-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .page-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .form-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-dark);
            padding: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        
        .form-help {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }
        
        .form-checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .form-checkbox-label {
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .form-errors {
            background: rgba(255, 51, 51, 0.1);
            border: 1px solid var(--red);
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--red);
        }
        
        .form-errors ul {
            margin: 0;
            padding-left: 20px;
        }
        
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-dark);
        }
</style>
{% endblock %}

{% block content %}
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">{% block page_title %}Setup{% endblock %}</h1>
            <p class="page-subtitle">{% block page_subtitle %}{% endblock %}</p>
        </div>
        
        {% block form_content %}{% endblock %}
    </div>
{% endblock %}
